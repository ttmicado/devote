name: Crawl & Notify

# 物件サイトの巡回 → マッチング → 通知（LINE / メール）
# 実行間隔は 30 分。GitHub の定期実行（schedule）は混雑すると数時間おきにしか動かないため、
# 終わった回が次の回を起動する（next ジョブ）。schedule は止まったときの再開用に残す
# 止めるときは リポジトリの Variables で CRAWL_SELF_SCHEDULE=0、またはワークフローを無効にする
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "巡回するソースID（カンマ区切り。空なら全て）"
        required: false
        default: ""
      max_details:
        description: "1サイトあたりの詳細取得の上限（初回の一括取得では大きくする）"
        required: false
        default: "300"

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      # 通知リンクの署名（Vercel の SESSION_SECRET と同じ値）
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      REINS_USER_ID: ${{ secrets.REINS_USER_ID }}
      REINS_PASSWORD: ${{ secrets.REINS_PASSWORD }}
      ATBB_USER_ID: ${{ secrets.ATBB_USER_ID }}
      ATBB_PASSWORD: ${{ secrets.ATBB_PASSWORD }}
      ITANDI_EMAIL: ${{ secrets.ITANDI_EMAIL }}
      ITANDI_PASSWORD: ${{ secrets.ITANDI_PASSWORD }}
      REINS_MONTHLY_SEARCH_LIMIT: ${{ vars.REINS_MONTHLY_SEARCH_LIMIT }}
      REINS_MONTHLY_DETAIL_LIMIT: ${{ vars.REINS_MONTHLY_DETAIL_LIMIT }}
      ENABLE_UNVERIFIED_SOURCES: ${{ vars.ENABLE_UNVERIFIED_SOURCES }}
      # 会員サイト（レインズ・ITANDI BB）を止めるときだけ 0（既定は巡回する。docs/member-sites.md）
      ENABLE_MEMBER_SOURCES: ${{ vars.ENABLE_MEMBER_SOURCES }}
      # 会員サイトで止まったときの待ち時間（分）。空なら 利用中60 / セッション切れ30 / ログイン失敗1440
      LOGIN_HOLD_IN_USE_MINUTES: ${{ vars.LOGIN_HOLD_IN_USE_MINUTES }}
      LOGIN_HOLD_SESSION_MINUTES: ${{ vars.LOGIN_HOLD_SESSION_MINUTES }}
      LOGIN_HOLD_AUTH_MINUTES: ${{ vars.LOGIN_HOLD_AUTH_MINUTES }}
      # 会員サイトを国内のセルフホストランナーで回す場合は、こちらでは公開サイトだけに絞る
      DEVOTE_SOURCES: ${{ inputs.sources || vars.DEVOTE_SOURCES }}
      DEVOTE_MAX_DETAILS_PER_SOURCE: ${{ inputs.max_details || '300' }}
      # 巡回の持ち時間（分）。過ぎたら取得済みの分を取り込んで終える（ジョブの時間制限 55 分で全部失わないように）
      DEVOTE_CRAWL_BUDGET_MINUTES: "40"
      DEVOTE_STORAGE_DIR: ${{ github.workspace }}/storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @devote/scraper exec playwright install --with-deps chromium
      # 会員サイトのログインセッション（storage/sessions）は actions/cache に保存しない。
      # キャッシュは同じリポジトリの他のワークフロー・ブランチからも読めるため、Cookie の置き場所として不適切。
      # 毎回ログインし直す（現状の巡回頻度では許容範囲）。詳しくは docs/member-sites.md
      - run: pnpm worker crawl

  # 巡回が失敗・タイムアウトしても、取り込めた分のマッチングと通知は必ず行う
  notify:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      # 通知リンクの署名（Vercel の SESSION_SECRET と同じ値）
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm worker match && pnpm worker notify

  # 次の回を起動する（この回の開始から30分は空ける）。GITHUB_TOKEN による workflow_dispatch は新しい実行を作れる。
  # 同時実行は concurrency で1つに絞られ、待ちの回は1つだけ残るので、起動が重なっても増え続けない
  next:
    needs: notify
    # schedule のイベントには repository の情報が無いので、schedule は無条件（常に既定ブランチで動く）
    if: always() && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) && vars.CRAWL_SELF_SCHEDULE != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 30分空けて次の回を起動
        run: |
          started=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          wait=$(( 30 * 60 - elapsed ))
          if [ "$wait" -gt 0 ]; then echo "次の回まで ${wait} 秒待つ"; sleep "$wait"; fi
          gh workflow run crawl.yml --ref "${{ github.ref_name }}"
