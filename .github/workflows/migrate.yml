name: DB Migrate

# 通常は Vercel のビルド時に自動でマイグレーションする（apps/web の build）。
# こちらは手動実行用と、マイグレーションを含む push 時の保険
on:
  push:
    paths: ["packages/db/drizzle/**"]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # マイグレーションは直接接続（unpooled）で行う
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
