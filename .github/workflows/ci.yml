name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devote
          POSTGRES_PASSWORD: devote
          POSTGRES_DB: devote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devote" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://devote:devote@localhost:5432/devote
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
