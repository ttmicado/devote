services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: devote
      POSTGRES_PASSWORD: devote
      POSTGRES_DB: devote
    ports:
      - "5432:5432"
    volumes:
      - devote-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devote"]
      interval: 5s
      retries: 10
volumes:
  devote-db:
