<div class="itandi-bb-login">
  <header class="header-itandibb">
    <a href="https://bukkakun.com/?&amp;&amp;" class="logo-container">
      <img alt="ITANDI BB（イタンジBB）" src="https://brand-ui.itandi.app/ia-itandi-logo.svg?v=2026101309" class="logo-itandibb">
    </a>
    <h1 class="header-title">ログイン</h1>
  </header>
  <div class="itandibb-content-wrapper" id="Content">
    <p class="itandibb-content-explanation">ご利用は初めてですか？</p>
    <div class="itandibb-content-container">
      <div class="login-content-container">
        <input id="accordion-check-1" class="accordion-check" type="checkbox">
        <label class="accordion-label" for="accordion-check-1">
          <h2 class="login-content-heading"><span class="strong-text">初めて</span>または
          <br class="sub-text">メールアドレス不明</h2>
        </label>
        <div class="accordion-content">
          <h3 class="login-form-heading">ITANDI BBへようこそ！</h3>
          <ul class="login-form-bullets">
            <li class="login-form-bullet">物件確認でITANDI BBへの誘導があった</li>
            <li class="login-form-bullet">内見予約・入居申込がしたい</li>
            <li class="login-form-bullet">自店舗が利用しているかわからない</li>
          </ul>
          <a href="https://bukkakun.com/cloud_chintai?&amp;&amp;">
            <button type="button" class="outlined-button">
              <p class="outlined-button-text">
                <span class="strong-text">代表電話認証で利用開始</span>
                <br>初めての場合はアカウントを作成します
              </p>
            </button>
</a>          <p class="login-form-description">不正業者をブロックするため、宅地建物取引業者に登録されている代表電話に発信して認証を行います。お手元に店舗代表電話をご用意ください。</p>
        </div>
      </div>
      <div class="login-content-container">
        <input id="accordion-check-2" class="accordion-check" type="checkbox">
        <label class="accordion-label" for="accordion-check-2">
          <h2 class="login-content-heading"><span class="strong-text">2回目以降</span>
          <br class="sub-text">ログイン</h2>
        </label>
        <div class="accordion-content long">
          <form action="/login" accept-charset="UTF-8" method="post"><input type="hidden" name="authenticity_token" value="MASKED" autocomplete="off">
            <div class="form-group">
              <label for="email" class="itandibb-form-label">ログイン用メールアドレス（半角英数字）</label>
              <input class="itandibb-form-control" placeholder="例）example@itandi.co.jp" type="text" name="email" id="email">
            </div>
            <div class="form-group">
              <label for="password" class="itandibb-form-label">パスワード（半角英数字記号 8文字以上）</label>
              <input class="itandibb-form-control" type="password" name="password" id="password">
              <img src="/images/icon/eye_close_line.svg" class="toggle-password">
            </div>
            <input type="submit" name="commit" value="ログイン" class="filled-button" data-disable-with="ログイン">
            <a href="/accounts/password_resets/new" class="itandibb-text-link-button">
              パスワード再発行
            </a>
            <p class="login-action-divider">または</p>
            <a href="https://portal.rabbynet.zennichi.or.jp/">
              <button type="button" class="rabbynet-login">
                <p class="rabbynet-login-text">
                  <span class="strong-text">ラビーネットでログイン</span>
                </p>
              </button>
            </a>
            <h3 class="login-form-help-heading">ログインでお困りの時は</h3>
            <a href="https://itandibb-broker.support.itandi.co.jp/hc/ja/articles/5980978203795?&amp;&amp;" target="_blank" rel="noopener noreferrer" class="itandibb-text-link-button-small">
              ログイン用メールアドレス・パスワードが分からない
            </a>
            <a href="https://itandibb-broker.support.itandi.co.jp/hc/ja/articles/7059527335315?&amp;&amp;" target="_blank" rel="noopener noreferrer" class="itandibb-text-link-button-small">
              社外から初めてログインをする
            </a>
            <a href="https://itandibb-broker.support.itandi.co.jp/hc/ja?&amp;&amp;" target="_blank" rel="noopener noreferrer" class="itandibb-text-link-button-small">
              カスタマーサポートサイト
            </a>
</form>        </div>
      </div>
    </div>
  </div>
